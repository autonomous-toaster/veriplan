# OpenSpec configuration
schema: spec-driven
context: |-
  Every artifact must be machine-parseable into a formal state machine model
  AND clearly readable by a human. Write so that tasks, requirements, and
  constraints translate directly to states, transitions, and invariants.

  Two rules apply across all artifacts:
  - TASK IDS: a task '1.3' in tasks.md is referenced as 'T1.3' in a spec
  requirement. The T prefix is REQUIRED in spec references.
  - 'human review only': a capability/policy that is NOT a temporal constraint
  must be marked 'human review only' in the requirement body. It is then
  treated as informational (INFO), not a blocker.

  Per-artifact rules below. Write requirements that an objective test can verify.
  Avoid vague verbs ("be robust", "be user-friendly").
rules:
  design:
  - Each task maps to a single state variable
  - For every requirement, note its temporal category and the task IDs involved
  - If a constraint cannot be formalised, mark it 'human review only'
  proposal:
  - State the problem as a gap a state machine model can detect
  - List non-goals to bound the formal model
  specs:
  - Every requirement MUST use an RFC 2119 keyword (MUST/SHALL/SHOULD/MAY/MUST NOT/SHALL NOT)
  - Every SHALL MUST reference at least one task by N.M ID (e.g. 'T2.1 SHALL complete before T2.3')
  - 'Every SHALL MUST use ONE temporal keyword: BEFORE, CONCURRENTLY, AFTER, IF...THEN, ALWAYS, or AT MOST ONE'
  - Put the SHALL sentence in a body paragraph AFTER the heading — the heading alone is not parsed
  - Every spec file MUST open with a Task Reference section — a table listing each T N.M ID used in the file with a one-line description, placed before the first requirement heading. This helps human reviewers see which tasks are involved at a glance.
  - Every WHEN and THEN step SHOULD reference a task ID (e.g. 'WHEN T3.2 runs')
  - Avoid vague SHALLs ('be robust', 'be user-friendly')
  - 'GOOD: T2.1 SHALL complete BEFORE T3.1 SHALL run (references task IDs + temporal keyword)'
  - 'BAD: The system SHALL auto-detect changes (no task ID, no temporal keyword — NonFormalizable)'
  - 'IF...THEN is for failure-recovery: IF T1.1 fails THEN T2.1 SHALL run'
  - 'For branching/decision logic, use BEFORE instead: T1.5 SHALL complete BEFORE T1.4'
  - Every scenario MUST have WHEN + THEN with RFC 2119 keyword; GIVEN is optional
  - 'Reference tasks by explicit ID: ''T2.1'' not ''the migration step'''
  - 'Use parenthetical syntax for task IDs: ''the migration step (T2.1)'''
  - 'BEFORE requires two task IDs: ''T2.1 SHALL complete BEFORE T3.1 SHALL run'''
  - 'ALWAYS requires one task ID: ''ALWAYS T2.1 SHALL validate input'''
  - Write requirement bodies in ACTIVE voice and name the acting task by ID (e.g. 'T2.1 SHALL resolve the path'), not passive prose like 'the path SHALL be resolved' — passive/hedged prose grounds poorly
  - Keep one temporal constraint per SHALL statement — do not cram two constraints into one requirement body
  - Keep each sentence under 30 words; split long requirement bodies into shorter sentences
  tasks:
  - Every task MUST have an N.M identifier (e.g. '1.3')
  - 'Group tasks under ## Phase headings'
  - Write descriptive task descriptions — they become aliases for grounding
  - Keep task descriptions terse and imperative (one instruction per sentence)
