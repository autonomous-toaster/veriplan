[package]
name = "veriplan"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"

# Parsing
tree-sitter = "0.26"
tree-sitter-language-pack = "1"

# LSP
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5"

# Grounding
groundcontrol = { path = "../groundcontrol" }

# Model output
tempfile = "3"
log = "0.4"
env_logger = "0.11"
streaming-iterator = "0.1"

# spin-rs: Rust-native Promela model checker (in-process alternative to spin binary)
spin-rs = { git = "https://github.com/autonomous-toaster/spin-rs", rev = "d1fa273" }

# Optional: Z3 SAT checking
z3 = { version = "0.14", optional = true }

[dev-dependencies]
kani = "0.0.1"

[package.metadata.kani]
flags = ["--enable-unstable"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = []
z3 = ["dep:z3"]

[package.metadata.cargo-machete]
ignored = [
  "crossbeam-channel",
  "env_logger",
  "log",
  "streaming-iterator",
  "thiserror",
  "z3",
  "spin-rs",
]
