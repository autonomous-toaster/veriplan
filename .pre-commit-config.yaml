repos:
  - repo: local
    hooks:
      # Checked with the build in this tree, not with a released binary: the published hook
      # pinned v0.1.0, a release that predates the specs it is checking, so the gate could
      # not see the tool it ships. The cost is one rebuild before the check.
      - id: veriplan-check
        name: veriplan check
        entry: cargo run --quiet -- check
        language: system
        pass_filenames: false
        types: [markdown]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -Dwarnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        pass_filenames: false
        types: [rust]

      - id: rust-file-length
        name: Rust file length (<=550 lines)
        entry: >-
          awk
          'END{if(FNR>550){print FILENAME": "FNR" lines (limit 550)";exit 1}}'
        language: system
        types: [rust]
        pass_filenames: true
        exclude: ^(target/|.*\.pb\.rs$)
